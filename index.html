<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f7f4">
  <meta name="robots" content="noindex">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fitness">
  <title>Fitness</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="titles">
        <h1 id="screen-title">Today</h1>
        <p id="screen-date" class="date"></p>
      </div>
      <button type="button" class="add" id="add-button">Add</button>
    </header>
    <p id="banner" class="banner" role="status" hidden></p>
    <main id="main">
      <p class="status">Loading…</p>
    </main>
    <nav class="tabs" aria-label="Sections">
      <button type="button" id="tab-today" data-screen="today" aria-current="page">Today</button>
      <button type="button" id="tab-history" data-screen="history">History</button>
    </nav>
  </div>

  <dialog id="editor" class="editor">
    <form id="workout-form">
      <div class="editor-bar">
        <button type="button" id="cancel">Cancel</button>
        <h2 id="editor-title">Add workout</h2>
        <button type="submit" id="save">Save</button>
      </div>
      <div class="fields">
        <label>
          Type
          <select id="type" name="type"></select>
        </label>
        <label>
          Start
          <input id="start" name="start" type="datetime-local" required>
        </label>
        <label>
          Duration (minutes)
          <input id="duration" name="duration" inputmode="numeric" autocomplete="off" enterkeyhint="done">
        </label>
        <label>
          Distance (km)
          <input id="distance" name="distance" inputmode="decimal" autocomplete="off" placeholder="Optional" enterkeyhint="done">
        </label>
        <label>
          Notes
          <textarea id="notes" name="notes" rows="4" placeholder="Optional"></textarea>
        </label>
        <p id="form-error" class="form-error" role="alert" hidden></p>
        <button type="button" id="delete" class="danger-text" hidden>Delete workout</button>
      </div>
      <div id="confirm" class="confirm" hidden>
        <div class="confirm-card">
          <h2>Delete this workout?</h2>
          <p>This removes it from this phone.</p>
          <div class="confirm-actions">
            <button type="button" id="confirm-cancel">Cancel</button>
            <button type="button" id="confirm-delete" class="danger-button">Delete workout</button>
          </div>
        </div>
      </div>
    </form>
  </dialog>
  <script type="module" src="js/app.js"></script>
</body>
</html>
